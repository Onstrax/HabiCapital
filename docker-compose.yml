services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habicapital_p2p
    ports:
      - "5433:5432"
    volumes:
      - habicapital-postgres:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habicapital_p2p"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/habicapital_p2p
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      APP_ORIGIN: http://localhost:3001
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api

  tests:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/habicapital_p2p
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/habicapital_p2p_test
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  habicapital-postgres:
