[project]
name = "habicapital-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3,<4",
  "passlib[argon2]>=1.7.4,<2",
  "PyJWT>=2.8,<3",
  "cryptography>=43,<47",
  "slowapi>=0.1.9,<1",
  "email-validator>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.23,<2", "pytest-cov>=5,<8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90.01
