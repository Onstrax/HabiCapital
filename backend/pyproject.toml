[project]
name = "habicapital-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
